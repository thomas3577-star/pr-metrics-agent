# pr-metrics configuration template.
# Copy to pr-metrics.config.yaml at the workspace root and edit.
# Every key and default is defined in references/METRICS.md, section 6.

# Required. The repo to measure, as owner/name.
repo: owner/name

# Target branches to include. Empty list = the repo's default branch.
branches: []

# Window length in days (default 28). Each run covers the current window and the previous one.
# Use the shortest window that gives at least 30 non-bot PRs. See METRICS.md rule 3.2.
window_days: 28

# Clock for durations: "calendar" or "business".
clock: calendar

# Used only when clock is "business". Assumes one team timezone.
business_hours:
  timezone: UTC         # IANA name, e.g. Asia/Kolkata
  workdays: [Mon, Tue, Wed, Thu, Fri]
  start: "09:00"
  end: "18:00"
  holidays: []          # ISO dates, e.g. ["2026-12-25"]

# Extra bot logins to exclude. Accounts of type "Bot" are always excluded.
bots: []

# File patterns excluded from PR size. Replace the list to override the defaults.
noise_patterns:
  - "**/package-lock.json"
  - "**/yarn.lock"
  - "**/pnpm-lock.yaml"
  - "**/go.sum"
  - "**/Cargo.lock"
  - "**/poetry.lock"
  - "**/*.pb.go"
  - "**/*_generated.*"
  - "**/generated/**"
  - "vendor/**"
  - "third_party/**"
  - "**/__snapshots__/**"
  - "**/*.min.js"

# Minimum PRs in a segment before p85 is reported.
min_sample: 30

# Days after merge within which a revert counts as a failure.
revert_window_days: 28

# Title words that mark a fix-PR candidate (listed, not counted).
fix_keywords: [fix, regression, hotfix]
